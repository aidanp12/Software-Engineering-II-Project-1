<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minesweeper</title>

    <!--RPM-->
    <!-- starts connecting to Google Fonts early so font can load faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!--RPM-->
    <!-- connects to Google's font file server -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--RPM-->
    <!-- imports the Press Start 2P font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!--RPM-->
    <!-- image shown as the icon on the browser tab -->
    <link rel="minesweeper tab icon" href="mine_bomb.png">

    <script src="grid.js"></script>
    <script src="ai.js"></script>
    <script src="ui.js"></script>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!--RPM-->
    <!-- black intro screen that appears before the game starts -->
    <div id="intro-screen">
        <!--RPM-->
        <!-- text telling the user to click to begin -->
        <p>CLICK TO BEGIN...</p>
    </div>

    <!--RPM-->
    <!-- button used to turn game audio on or off -->
    <button id="volume-button">
        <!--RPM-->
        <!-- image inside the volume button -->
        <img id="volume-icon" src="volume_on.png" alt="Volume">
    </button>

    <!--RPM-->
    <!-- three fire elements placed around the Minesweeper title -->
    <div class="title-fire fire-one"></div>
    <div class="title-fire fire-two"></div>
    <div class="title-fire fire-three"></div>

    <!--RPM-->
    <!-- explosion effect used when the title animation happens -->
    <div class="title-explosion"></div>

    <!--RPM-->
    <!-- shadow underneath the Minesweeper title -->
    <div class="title-shadow"></div>
    <h1 class="title">MINESWEEPER</h1>


    <!--
    AI USE - webpage art / game-area layout

    How/why AI was used:
    ChatGPT was used to help keep the flag counter positioned with the Minesweeper
    grid across browser zoom levels, and then to correct the webpage artwork after
    grouping the grid and counter changed the artwork's position.

    Specific prompts entered:
    1. "is there a way to positionally keep the flag counter on top of the grid?"

    2. "cool but now one thing i noticed also is that the art for the title web page
       didnt show up until after the explositon, and was disaligned from where it was,
       i suspect that the resaon is becasue i put

           <div id="main-container" class="grid-stack">
               <img
                   class="webpage_art"
                   src="minesweeper_page_art.png"
                   alt="pixel character"
               >
           </div>

       inside of the id="game-area", so how do i undo that but keep what you said"

    Validation/revisions:
    The layout was visually tested at different browser zoom levels, including 50%
    and 100%. The first version grouped the decorative artwork inside #game-area,
    which caused the artwork to become misaligned. The HTML was revised so
    .webpage_art stays outside #game-area while #container-two and #main-container
    remain grouped together.

    Challenges/limitations:
    Positioning depended on which parent element contained the artwork and counter.
    Putting the artwork inside the positioned #game-area changed its positioning
    reference, so the original AI-assisted structure needed to be revised.

    AI-assisted section:
    The placement of .webpage_art and the #game-area wrapper containing
    #container-two and #main-container.
    -->


    <!--RPM-->
    <!-- decorative Minesweeper image shown on the webpage -->
    <img
        class="webpage_art"
        src="minesweeper_page_art.png"
        alt="pixel character"
    >

    <!--RPM-->
    <!-- main area that holds the game and its nearby information -->
    <div id="game-area">

    <div id="board-wrapper">

        <div id="container-two"></div>

        <div id="main-container" class="grid-stack"></div>

    </div>

</div>

    <!-- Scoreboard for 2-player / vs-AI games. Outside #game-area so the screen shake doesn't move it. -->
    <div id="turn-indicator"></div>

</body>

</html>
